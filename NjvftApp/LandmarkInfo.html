<!-- Landmark Information Modal Content -->

<div class="info-modal-content">

    <!-- Close Info Button inside the modal -->
    <button id="close-info-btn" class="close-info-btn">
        &times;
    </button>

    <!-- Photo Container -->
    <div class="image-content">
        <img src="{{IMAGE}}" alt="Landmark Photo" width="500" height="300">
    </div>
    
    <!-- Title Header -->
    <h2>{{NAME}}</h2>
    <h3>{{CITY}}, New Jersey</h3> 
    
    <!-- Landmark Description Block -->
    <div class="description-box">
        <p>{{DESCRIPTION}}</p>
    </div>
    
    <!-- Fun Fact Block -->
    <div class="description-box-fun-fact">
        <p><strong>Fun Fact:</strong> {{FUN_FACT}}</p>
    </div>
    
    <!-- Official Link -->
    <p class="official-link-text">
        For more information, visit the <a href="{{URL}}" target="_blank">official website!</a>
    </p>

    <!-- Route Button Block -->
    <div class="route-button-box">
        <label for="route-btn">Click the button below for driving directions</label>
        <button id="route-btn" class="modal-route-action-btn">Get Route</button>
    </div>

    <!-- Star Rating Space -->
    <div class="star-rating-box">
        <p class="rating-prompt">Did you enjoy exploring this landmark? Leave a rating below!</p>
        <div id="star-rating-message"></div>
        <div id="star-rating-root" class="rating-container"></div>
    </div>
    
</div>
