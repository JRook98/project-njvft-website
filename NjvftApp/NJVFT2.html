<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NJVFT</title>
    <style>        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center;          
            background-color: aliceblue;
            box-sizing: border-box;
            min-height: 100vh;
        }
        header {
            display: flex;
            flex-direction: column;
            position: relative;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            margin-bottom: 20px;
            width: 100%;
            background-color: green;
            padding: 15px 0;
            box-sizing: border-box;
        }
        header img {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 100px;
            width: auto;
        }
        .header-text {
            text-align: center;
            color: white; 
        }
        .header-text h1, .header-text h3 {
            margin: 0;
        }
        /* To create the two-columns */
        .content-layout {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 40px; 
            align-items: flex-start; 
            margin-bottom: 40px;
            box-sizing: border-box;
            flex: 1; 
        }
        /* Left column styling for the dropdown */
        .left-column {
            flex: 3;
            min-width: 250px;
            padding: 10px;
            box-sizing: border-box;
        }
		.left-column select:hover {
			background-color: lightblue;
			cursor: pointer;
		}
        .left-column select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-bottom: 40px; 
        }
        .left-column button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .left-column button:hover {
            background-color: lightblue;
        }
        /* Container to center and size the map */
        #map-container {
            flex: 7; 
            width: 100%;
            box-sizing: border-box;
        }
        #map {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        /* Footer Styling */
        footer {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            background-color: #f1f1f1;
            border-radius: 4px;
            font-size: 14px;
            color: black;
            box-sizing: border-box;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Title of website as header -->
    <header>
        <img src="Insert_Logo.png" alt="NJVFT_Logo">
        <div class="header-text">
            <h1>NJVFT</h1>
            <h3>New Jersey Virtual Field Trip</h3>
        </div>
    </header>

    <!-- Main Layout Wrapper -->
    <div class="content-layout">
        <!-- Left Column with Dropdown Menu -->
        <div class="left-column">
            <label for="location-select" style="display: block; margin-bottom: 8px; font-weight: bold; text-align: center">NJ Landmark Options</label>
            <select id="location-select">
                <option value="">Select a Landmark</option>
                <option value="beaches">Beaches</option>
                <option value="museums">Museums</option>
                <option value="historic-villages">Historic Villages</option>
            </select>
            
            <!-- Route button Label -->
            <label for="route-btn" style="display: block; margin-top: 125px; margin-bottom: 8px; font-weight: bold; text-align: center">Click the Button Below for Driving Directions</label>
            <button id="route-btn">Get Route</button>
            
            <!-- Star Rating Label -->
            <label for="rating-system" style="display: block; margin-top: 40px; margin-bottom: 8px; font-weight: bold; text-align: center">Star Rating</label>
        </div>

        <!-- Map rendering container -->
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 NJVFT: New Jersey Virtual Field Trip. CS10430. All rights reserved.</p>
    </footer>

    <script>
    function initMap() {
        const MAP_CENTER = { lat: 40.1147, lng: -74.7707 };
        const MAP_BOUNDS = {
            north: 41.46,
            south: 38.72,
            west: -75.66,
            east: -73.89,
        };

        const mapObject = new google.maps.Map(document.getElementById("map"), {
            zoom: 8,
            maxZoom: 11,
            center: MAP_CENTER,
            restriction: {
                latLngBounds: MAP_BOUNDS,
                strictBounds: false
            }
        });

        let currentMarker = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const userPos = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                currentMarker = new google.maps.Marker({
                    position: userPos,
                    map: mapObject,
                    title: "Your Location"
                });
            });
        }

        mapObject.addListener("click", (event) => {
            currentMarker = new google.maps.Marker({
                position: event.latLng,
                map: mapObject
            });
        });
    }
    </script>

    <!-- Loads Google Maps API and calls the initMap() function -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-Ep4rBtq2tecPJgVqHYS9vt6vKwFLFuE&callback=initMap" async defer></script>

</body>
</html>
