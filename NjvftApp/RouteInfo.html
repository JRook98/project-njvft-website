<!-- Route Information Modal Content -->

<style>

    /* Route modal content styling */
    .route-modal-content {
        position: relative;
        width: 100%;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: aliceblue;
    }


    /* Route modal title */
    .route-modal-content h2 {
        margin-top: 0;
        margin-bottom: 20px;
    }


    /* Close button styling */
    .close-route-btn {
        position: absolute;
        right: 0;
        top: 0;
        font-size: 24px;
        font-weight: bold;
        background-color: white;
        border: 2px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
    }


    /* Close button hover */
    .close-route-btn:hover {
        background-color: lightblue;
    }


    /* Container styling for route inputs */
    .route-input-group {
        width: 100%;
        margin: 25px 0;
        text-align: left;
    }


    /* Route input label styling */
    .route-input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }


    /* Route dropdown styling */
    .route-input-group select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }


    /* Route dropdown hover */
    .route-input-group select:hover {
        background-color: lightblue;
        cursor: pointer;
    }


    /* Get Directions and Clear Route button styling */
    #get-directions-btn,
    #clear-route-btn {
        width: 100%;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        background-color: green;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }


    /* Route button hover */
    #get-directions-btn:hover,
    #clear-route-btn:hover {
        background-color: lightblue;
        color: black;
    }


    /* Error message styling */
    #route-error {
        color: red;
        font-weight: bold;
        margin: 20px 0;
    }


    /* Route results styling */
    #route-results {
        margin: 25px 0;
        padding-top: 15px;
        border-top: 1px solid #ccc;
    }

</style>


<div class="route-modal-content">

    <!-- Close Route Button -->
    <button id="close-route-btn" class="close-route-btn">
        &times;
    </button>

    <h2>Plan Your Route</h2>

    <p>
        Select your starting location and destination.
    </p>


    <!-- Starting Route Location -->
    <div class="route-input-group">

        <label for="start-location">
            Starting Location
        </label>

        <select id="start-location">

            <option value="current">
                My Current Location
            </option>

            <option value="map">
                Location Selected on Map
            </option>

        </select>

    </div>


    <!-- Destination -->
    <div class="route-input-group">

        <label for="route-destination">
            Destination
        </label>

        <select id="route-destination">

            <option value="">
                Select a Landmark
            </option>

        </select>

    </div>


    <!-- Route Button -->
    <button id="get-directions-btn">
        Get Directions
    </button>


    <!-- Error Message -->
    <p id="route-error"></p>


    <!-- Dynamic Route Results -->
    <div id="route-results">

        <h3>Route Information</h3>

        <p>
            <strong>Distance:</strong>
            <span id="route-distance">--</span>
        </p>

        <p>
            <strong>Estimated Drive Time:</strong>
            <span id="route-time">--</span>
        </p>

    </div>


    <!-- Clear Route Button -->
    <button id="clear-route-btn">
        Clear Route
    </button>

</div>
