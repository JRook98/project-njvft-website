<!-- Route Information Modal Content -->

<div class="route-modal-content">

    <!-- Close Route Button -->
    <button id="close-route-btn" class="close-route-btn">
        &times;
    </button>

    <h2>Plan Your Route</h2>

    <p>
        Select your starting location and destination.
    </p>


    <!-- Starting Route Location -->
    <div class="route-input-group">

        <label for="start-location">
            Starting Location
        </label>

        <select id="start-location">

            <option value="current">
                My Current Location
            </option>

            <option value="map">
                Location Selected on Map
            </option>

        </select>

    </div>


    <!-- Destination -->
    <div class="route-input-group">

        <label for="route-destination">
            Destination
        </label>

        <select id="route-destination">

            <option value="">
                Select a Landmark
            </option>

        </select>

    </div>


    <!-- Route Button -->
    <button id="get-directions-btn">
        Get Directions
    </button>


    <!-- Error Message -->
    <p id="route-error"></p>


    <!-- Dynamic Route Results -->
    <div id="route-results">

        <h3>Route Information</h3>

        <p>
            <strong>Distance:</strong>
            <span id="route-distance">--</span>
        </p>

        <p>
            <strong>Estimated Drive Time:</strong>
            <span id="route-time">--</span>
        </p>

    </div>


    <!-- Clear Route Button -->
    <button id="clear-route-btn">
        Clear Route
    </button>

</div>
<script>
    
const routeButton = document.getElementById("route-btn");

const routeModal = document.getElementById("route-modal");

const routeModalContainer = document.getElementById("route-modal-container");

// When the Get Route button is clicked
routeButton.addEventListener("click", function () {

    // Load RouteInfo.html
    fetch("RouteInfo.html")

        .then(response => {

            if (!response.ok) {
                throw new Error("Unable to load RouteInfo.html");
            }

            return response.text();
        })

        .then(html => {

            // Put RouteInfo.html inside the modal
            routeModalContainer.innerHTML = html;
            
            // Show the modal
            routeModal.style.display = "flex";

            // Grab the close button from RouteInfo.html
            const closeButton =
                document.getElementById("close-route-btn");

            // Close modal when X is clicked
            closeButton.addEventListener("click", function () {

                routeModal.style.display = "none";

            });

        })

        .catch(error => {

            console.error("Error loading Route modal:", error);

        });

});


// Close modal when clicking outside of the modal box
routeModal.addEventListener("click", function (event) {

    if (event.target === routeModal) {

        routeModal.style.display = "none";

    }

});
</script>
